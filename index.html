<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="google" content="notranslate">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Grupo Terracop - Gestión y Control de Licitaciones</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <style>
    :root {
      --bg-main: #0b1329;
      --bg-card: #152238;
      --bg-card-hover: #1c2d4a;
      --bg-surface: #0f1c32;
      --border-color: #243859;
      --border-light: #334e77;
      --text-main: #f1f5f9;
      --text-muted: #94a3b8;
      --text-dim: #64748b;
      --accent-blue: #3b82f6;
      --accent-green: #10b981;
      --accent-orange: #f59e0b;
      --accent-red: #ef4444;
      --accent-purple: #8b5cf6;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background-color: var(--bg-main); color: var(--text-main); min-height: 100vh; display: flex; justify-content: center; padding: 12px; }
    .app-container { width: 100%; max-width: 980px; display: flex; flex-direction: column; gap: 14px; }
    
    .header-bar { display: flex; align-items: center; justify-content: space-between; background: linear-gradient(135deg, #182640 0%, #0d1728 100%); padding: 14px 18px; border-radius: 16px; border: 1px solid var(--border-color); box-shadow: 0 6px 24px rgba(0, 0, 0, 0.4); flex-wrap: wrap; gap: 12px; }
    .brand-group { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
    .brand-logo-card { background: #ffffff; padding: 6px 14px; border-radius: 10px; display: inline-flex; align-items: center; justify-content: center; border: 1px solid rgba(255, 255, 255, 0.2); }
    .brand-logo-card svg { height: 40px; width: auto; display: block; }
    .header-title-box { display: flex; flex-direction: column; }
    .header-title { font-size: 16px; font-weight: 900; text-transform: uppercase; letter-spacing: 0.8px; color: #ffffff; }
    .header-sub { font-size: 11px; color: #38bdf8; font-weight: 600; }
    
    .header-actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .btn-upload { background: #059669; color: #fff; border: none; padding: 7px 14px; border-radius: 20px; font-size: 11.5px; font-weight: 700; cursor: pointer; display: flex; align-items: center; gap: 5px; transition: 0.2s; }
    .btn-upload:hover { background: #10b981; }
    .sync-status { display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--accent-green); background: rgba(16, 185, 129, 0.12); padding: 6px 12px; border-radius: 20px; border: 1px solid rgba(16, 185, 129, 0.25); }
    .sync-dot { width: 8px; height: 8px; background-color: var(--accent-green); border-radius: 50%; box-shadow: 0 0 8px var(--accent-green); animation: pulse 1.8s infinite; }
    @keyframes pulse { 0% { transform: scale(0.9); opacity: 0.6; } 50% { transform: scale(1.3); opacity: 1; } 100% { transform: scale(0.9); opacity: 0.6; } }

    /* Barra de Pestañas Navegables con Scroll Horizontal */
    .tabs-wrapper { background: var(--bg-surface); border: 1px solid var(--border-color); border-radius: 14px; padding: 8px 10px; display: flex; gap: 8px; overflow-x: auto; scrollbar-width: thin; -webkit-overflow-scrolling: touch; }
    .tabs-wrapper::-webkit-scrollbar { height: 5px; }
    .tabs-wrapper::-webkit-scrollbar-thumb { background: var(--border-light); border-radius: 10px; }
    
    .tab-btn { background: #121e33; border: 1px solid var(--border-color); color: var(--text-muted); font-size: 11.5px; font-weight: 700; padding: 8px 14px; border-radius: 10px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; transition: all 0.2s ease; user-select: none; }
    .tab-btn:hover { background: var(--bg-card-hover); color: #fff; border-color: var(--border-light); }
    .tab-badge { background: rgba(255, 255, 255, 0.1); font-size: 10px; font-weight: 800; padding: 2px 7px; border-radius: 12px; color: #fff; }
    
    .tab-btn.active-todas { background: rgba(56, 189, 248, 0.18); border-color: #38bdf8; color: #38bdf8; box-shadow: 0 0 10px rgba(56, 189, 248, 0.2); }
    .tab-btn.active-todas .tab-badge { background: #38bdf8; color: #0b1329; }

    .tab-btn.active-estudio { background: rgba(59, 130, 246, 0.2); border-color: #3b82f6; color: #93c5fd; box-shadow: 0 0 10px rgba(59, 130, 246, 0.2); }
    .tab-btn.active-estudio .tab-badge { background: #3b82f6; color: #fff; }

    .tab-btn.active-aprobacion { background: rgba(139, 92, 246, 0.25); border-color: #8b5cf6; color: #ddd6fe; box-shadow: 0 0 10px rgba(139, 92, 246, 0.2); }
    .tab-btn.active-aprobacion .tab-badge { background: #8b5cf6; color: #fff; }

    .tab-btn.active-critico { background: rgba(239, 68, 68, 0.25); border-color: #ef4444; color: #fca5a5; box-shadow: 0 0 12px rgba(239, 68, 68, 0.3); }
    .tab-btn.active-critico .tab-badge { background: #ef4444; color: #fff; }

    .tab-btn.active-enviada { background: rgba(14, 165, 233, 0.22); border-color: #0284c7; color: #7dd3fc; box-shadow: 0 0 10px rgba(14, 165, 233, 0.2); }
    .tab-btn.active-enviada .tab-badge { background: #0284c7; color: #fff; }

    .tab-btn.active-pausa { background: rgba(245, 158, 11, 0.25); border-color: #f59e0b; color: #fde68a; box-shadow: 0 0 10px rgba(245, 158, 11, 0.2); }
    .tab-btn.active-pausa .tab-badge { background: #f59e0b; color: #1e1b4b; }

    .tab-btn.active-desistida { background: rgba(148, 163, 184, 0.2); border-color: #64748b; color: #e2e8f0; box-shadow: 0 0 10px rgba(148, 163, 184, 0.2); }
    .tab-btn.active-desistida .tab-badge { background: #64748b; color: #fff; }

    .tab-btn.active-adjudicada { background: rgba(16, 185, 129, 0.25); border-color: #10b981; color: #6ee7b7; box-shadow: 0 0 10px rgba(16, 185, 129, 0.25); }
    .tab-btn.active-adjudicada .tab-badge { background: #10b981; color: #fff; }

    .tab-btn.active-no-adj { background: rgba(239, 68, 68, 0.22); border-color: #ef4444; color: #fca5a5; box-shadow: 0 0 10px rgba(239, 68, 68, 0.2); }
    .tab-btn.active-no-adj .tab-badge { background: #ef4444; color: #fff; }

    /* Filtros complementarios */
    .filters-section { background: var(--bg-surface); border: 1px solid var(--border-color); border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 12px; }
    .filters-grid { display: grid; grid-template-columns: 1fr; gap: 10px; }
    @media (min-width: 650px) { .filters-grid { grid-template-columns: repeat(3, 1fr); } }
    .filter-group { display: flex; flex-direction: column; gap: 5px; }
    .filter-label { font-size: 10px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; }
    .custom-select, .search-input { background-color: #121e33; border: 1px solid var(--border-color); color: #e2e8f0; font-size: 13px; font-weight: 500; border-radius: 8px; padding: 9px 12px; outline: none; width: 100%; }
    .custom-select:focus, .search-input:focus { border-color: var(--accent-blue); }
    .filter-actions { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-top: 4px; }
    .btn-reset { background: #1e3a8a; color: white; font-weight: 700; font-size: 12px; border: none; padding: 8px 16px; border-radius: 8px; cursor: pointer; }
    .results-count { font-size: 12px; color: var(--text-muted); font-weight: 600; }

    /* Tarjetas de licitación */
    .cards-container { display: flex; flex-direction: column; gap: 12px; }
    .lic-card { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 14px; padding: 16px; display: flex; flex-direction: column; gap: 12px; cursor: pointer; transition: all 0.2s ease; position: relative; }
    .lic-card:hover { border-color: var(--accent-blue); transform: translateY(-2px); box-shadow: 0 6px 18px rgba(0, 0, 0, 0.35); }
    .card-top-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
    .mandante-title { font-weight: 800; font-size: 16px; color: #ffffff; display: flex; align-items: center; gap: 8px; }
    .badge-code { background: #0f172a; border: 1px solid var(--border-light); color: #38bdf8; font-weight: 800; font-size: 11px; padding: 3px 8px; border-radius: 6px; }
    
    .status-badge { font-size: 11px; font-weight: 800; padding: 5px 12px; border-radius: 20px; display: inline-flex; align-items: center; gap: 5px; text-transform: uppercase; letter-spacing: 0.3px; }
    .badge-estudio { background: rgba(59, 130, 246, 0.22); color: #93c5fd; border: 1px solid #3b82f6; }
    .badge-aprobacion { background: rgba(139, 92, 246, 0.25); color: #ddd6fe; border: 1px solid #8b5cf6; }
    .badge-enviada { background: rgba(14, 165, 233, 0.22); color: #7dd3fc; border: 1px solid #0284c7; }
    .badge-adjudicada { background: rgba(16, 185, 129, 0.25); color: #6ee7b7; border: 1px solid #10b981; }
    .badge-no-adj { background: rgba(239, 68, 68, 0.25); color: #fca5a5; border: 1px solid #ef4444; }
    .badge-desistida { background: rgba(148, 163, 184, 0.2); color: #cbd5e1; border: 1px solid #64748b; }
    .badge-pausa { background: rgba(245, 158, 11, 0.25); color: #fde68a; border: 1px solid #f59e0b; }

    .project-name { font-size: 13.5px; font-weight: 600; color: #cbd5e1; line-height: 1.4; }
    .service-tag { display: inline-block; background: rgba(56, 189, 248, 0.1); color: #38bdf8; font-size: 11px; font-weight: 700; padding: 3px 8px; border-radius: 6px; width: fit-content; border: 1px solid rgba(56, 189, 248, 0.25); }

    .timeline-strip { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; background: rgba(11, 19, 41, 0.5); padding: 10px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.06); }
    .step-item { display: flex; flex-direction: column; gap: 4px; text-align: center; align-items: center; }
    .step-label { font-size: 9.5px; color: var(--text-dim); font-weight: 800; text-transform: uppercase; letter-spacing: 0.5px; }
    
    .badge-semaforo { font-size: 10.5px; font-weight: 700; padding: 3px 8px; border-radius: 6px; display: inline-flex; align-items: center; justify-content: center; gap: 4px; width: 95%; max-width: 140px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .sem-verde { background: rgba(16, 185, 129, 0.2); color: #6ee7b7; border: 1px solid rgba(16, 185, 129, 0.45); }
    .sem-amarillo { background: rgba(245, 158, 11, 0.25); color: #fde68a; border: 1px solid rgba(245, 158, 11, 0.5); }
    .sem-rojo { background: rgba(239, 68, 68, 0.25); color: #fca5a5; border: 1px solid rgba(239, 68, 68, 0.5); font-weight: 800; }
    .sem-azul { background: rgba(14, 165, 233, 0.2); color: #7dd3fc; border: 1px solid rgba(14, 165, 233, 0.45); }
    .sem-morado { background: rgba(139, 92, 246, 0.2); color: #ddd6fe; border: 1px solid rgba(139, 92, 246, 0.45); }
    .sem-naranja { background: rgba(249, 115, 22, 0.22); color: #fed7aa; border: 1px solid rgba(249, 115, 22, 0.45); }
    .sem-gris { background: rgba(148, 163, 184, 0.12); color: #94a3b8; border: 1px solid rgba(148, 163, 184, 0.25); }

    .card-footer-alert { display: flex; align-items: center; justify-content: space-between; gap: 10px; font-size: 11.5px; padding-top: 8px; border-top: 1px dashed var(--border-color); }
    .alert-tag { font-weight: 800; padding: 4px 10px; border-radius: 6px; font-size: 11px; display: inline-flex; align-items: center; gap: 5px; }

    .modal-overlay { position: fixed; inset: 0; background: rgba(4, 9, 20, 0.85); backdrop-filter: blur(5px); display: none; align-items: center; justify-content: center; z-index: 9999; padding: 16px; }
    .modal-overlay.active { display: flex; }
    .modal-container { background: #152238; border: 1px solid var(--border-light); border-radius: 16px; width: 100%; max-width: 620px; box-shadow: 0 10px 40px rgba(0,0,0,0.6); display: flex; flex-direction: column; overflow: hidden; }
    .modal-header { background: #182640; padding: 14px 18px; border-bottom: 1px solid var(--border-color); display: flex; align-items: center; justify-content: space-between; }
    .modal-title { font-size: 15px; font-weight: 800; color: #ffffff; }
    .btn-close-modal { background: transparent; border: none; color: var(--text-muted); font-size: 20px; cursor: pointer; padding: 4px; }
    .modal-body { padding: 18px; display: flex; flex-direction: column; gap: 14px; max-height: 80vh; overflow-y: auto; }
    .modal-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; background: rgba(11, 19, 41, 0.6); border: 1px solid var(--border-color); padding: 14px; border-radius: 10px; }
    .modal-section-title { font-size: 11px; font-weight: 800; color: #38bdf8; text-transform: uppercase; margin-bottom: -4px; }
    .meta-item { display: flex; flex-direction: column; gap: 2px; }
    .meta-label { font-size: 10px; color: var(--text-dim); font-weight: 600; text-transform: uppercase; }
    .meta-val { color: #cbd5e1; font-weight: 500; font-size: 12.5px; }
    .meta-val.highlight { color: #38bdf8; font-weight: 700; }
  </style>
</head>
<body>
  <div class="app-container">
    <header class="header-bar">
      <div class="brand-group">
        <div class="brand-logo-card">
          <svg viewBox="0 0 280 85" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M4 14 L38 14 C48 14 55 24 50 36 L24 80 C21 85 14 85 12 80 L3 58 C1 54 2 49 6 46 L36 24 C40 21 38 16 33 16 L4 16 Z" fill="url(#terraGrad)" />
            <path d="M48 6 H76 V28 H48 Z" fill="#182c4d" />
            <defs>
              <linearGradient id="terraGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#1e3a8a" />
                <stop offset="45%" stop-color="#38bdf8" />
                <stop offset="100%" stop-color="#0284c7" />

            </defs>
            <text x="86" y="32" font-family="'Inter', sans-serif" font-weight="900" font-size="25" fill="#0284c7" letter-spacing="2">GRUPO</text>
            <text x="86" y="68" font-family="'Inter', sans-serif" font-weight="900" font-size="34" fill="#111c38" letter-spacing="1">terracop</text>
          </svg>
        </div>
        <div class="header-title-box">
          <h1 class="header-title">Pipeline de Licitaciones</h1>
          <span class="header-sub">Gestión Comercial y Control de Fechas Críticas</span>
        </div>
      </div>
      <div class="header-actions">
        <input type="file" id="excelUploadInput" accept=".xlsx, .xls" style="display:none;" onchange="handleExcelUpload(event)" />
        <button type="button" class="btn-upload" onclick="document.getElementById('excelUploadInput').click()">
          📁 Cargar Nuevo Excel
        </button>
        <div id="last-update-display" style="font-size:10.5px; color:#94a3b8; font-weight:600; padding:6px 12px; background:rgba(255,255,255,0.05); border-radius:20px; border:1px solid rgba(255,255,255,0.1); white-space:nowrap;">

    </header>

    <!-- Barra de Pestañas de Acceso Rápido -->
    <nav class="tabs-wrapper" id="statusTabsNav">
      <button type="button" class="tab-btn active-todas" id="tab-todas" onclick="setTabFilter('TODOS')">
        🔘 Todas <span class="tab-badge" id="badge-count-todas">0</span>

      <button type="button" class="tab-btn" id="tab-estudio" onclick="setTabFilter('EN ESTUDIO')">

      <button type="button" class="tab-btn" id="tab-aprobacion" onclick="setTabFilter('EN APROBACION')">

      <button type="button" class="tab-btn" id="tab-critico" onclick="setTabFilter('CRITICO')">
        🚨 Hitos ≤ 2 Días <span class="tab-badge" id="badge-count-critico">0</span>
      </button>
      <button type="button" class="tab-btn" id="tab-enviada" onclick="setTabFilter('OFERTA ENVIADA')">

      <button type="button" class="tab-btn" id="tab-pausa" onclick="setTabFilter('EN PAUSA')">
        ⏸️ En Pausa Mandante <span class="tab-badge" id="badge-count-pausa">0</span>
      </button>
      <button type="button" class="tab-btn" id="tab-desistida" onclick="setTabFilter('DESISTIDA')">

      <button type="button" class="tab-btn" id="tab-adjudicada" onclick="setTabFilter('ADJUDICADA')">

        ❌ No Adjudicadas <span class="tab-badge" id="badge-count-no-adj">0</span>

    <section class="filters-section">
      <div class="filters-grid">
        <div class="filter-group">
          <label class="filter-label">Buscar (Proyecto / Código / Mandante)</label>
          <input type="text" id="searchInput" class="search-input" placeholder="Ej: Candelaria, LIC-2026, Caminos..." oninput="applyFilters()" />
        </div>
        <div class="filter-group">
          <label class="filter-label">Tipo de Servicio</label>
          <select id="tipoServicioSelect" class="custom-select" onchange="applyFilters()"><option value="TODOS">Todos los servicios</option></select>
        </div>
        <div class="filter-group">
          <label class="filter-label">Mandante / Cliente</label>
          <select id="mandanteSelect" class="custom-select" onchange="applyFilters()"><option value="TODOS">Todos los mandantes</option></select>

  <div id="licitacionModal" class="modal-overlay" onclick="closeModal(event)">

      <div class="modal-header">
        <div class="modal-title" id="modalHeaderTitle">Detalle de Licitación</div>
        <button type="button" class="btn-close-modal" onclick="closeModalDirect()">✕</button>
      </div>
      <div class="modal-body" id="modalBodyContent"></div>
    </div>
  </div>

  <script>
    const NPOINT_URL = 'https://api.npoint.io/6c291be30d583b512a2e';

    let DATA_LIC = [];
    let LISTA_SERVICIOS = [];
    let LISTA_MANDANTES = [];
    let currentFilterState = 'TODOS';

    function parseDateObj(val) {
      if (!val && val !== 0) return null;
      if (val instanceof Date) return isNaN(val.getTime()) ? null : val;
      if (typeof val === 'number' || (!isNaN(val) && !isNaN(parseFloat(val)) && String(val).trim().length <= 6)) {
        var num = parseFloat(val);
        var date = new Date(Math.round((num - 25569) * 86400 * 1000));
        var userOffset = date.getTimezoneOffset() * 60000;
        return new Date(date.getTime() + userOffset);
      }
      var s = String(val).trim();
      var matchDMY = s.match(/^(\\d{1,2})[\\/\\-](\\d{1,2})[\\/\\-](\\d{4})/);
      if (matchDMY) {
        return new Date(parseInt(matchDMY[3], 10), parseInt(matchDMY[2], 10) - 1, parseInt(matchDMY[1], 10));
      }
      var parsed = new Date(s);
      return isNaN(parsed.getTime()) ? null : parsed;
    }

    function formatExcelDate(val) {
      if (!val && val !== 0) return '';
      var s = String(val).trim();
      if (!s || s.toLowerCase().includes('nan') || s.toLowerCase().includes('nat') || s.toLowerCase().includes('sin fecha') || s.toLowerCase().includes('no aplica')) return '';

      var matchHora = s.match(/\\b\\d{1,2}:\\d{2}\\b/);
      var strHora = matchHora ? ' (' + matchHora[0] + ' hrs)' : '';

      var matchDMY = s.match(/^(\\d{1,2})[\\/\\-](\\d{1,2})[\\/\\-](\\d{4})/);
      if (matchDMY) {
        var d = ('0' + matchDMY[1]).slice(-2);
        var m = ('0' + matchDMY[2]).slice(-2);
        return d + '/' + m + '/' + matchDMY[3] + strHora;
      }

      var dObj = parseDateObj(val);
      if (dObj) {
        var dia = ('0' + dObj.getDate()).slice(-2);
        var mes = ('0' + (dObj.getMonth() + 1)).slice(-2);
        var anio = dObj.getFullYear();
        return dia + '/' + mes + '/' + anio + strHora;
      }

      return s;
    }

    function diffDays(targetDate) {
      var d = parseDateObj(targetDate);
      if (!d) return null;
      var now = new Date();
      var tNow = new Date(now.getFullYear(), now.getMonth(), now.getDate()).getTime();
      var tTarget = new Date(d.getFullYear(), d.getMonth(), d.getDate()).getTime();
      return Math.round((tTarget - tNow) / (1000 * 60 * 60 * 24));
    }

    function getSemaforoClass(text) {
      if (!text) return 'sem-gris';
      var s = String(text).toUpperCase();
      if (s.includes('✅') || s.includes('🟢') || s.includes('REALIZADA') || s.includes('ENVIADAS') || s.includes('EN PLAZO') || s.includes('NORMAL')) return 'sem-verde';
      if (s.includes('📬') || s.includes('OFERTA ENVIADA') || s.includes('ENVIADA')) return 'sem-azul';
      if (s.includes('🏆') || s.includes('ADJUDICADA')) return 'sem-verde';
      if (s.includes('⚠️') || s.includes('APROBACIÓN') || s.includes('JEFATURA')) return 'sem-morado';
      if (s.includes('🟡') || s.includes('HOY') || s.includes('PRÓXIMO') || s.includes('PREPARAR')) return 'sem-amarillo';
      if (s.includes('⏸️') || s.includes('PAUSA') || s.includes('STANDBY')) return 'sem-naranja';
      if (s.includes('🔴') || s.includes('❌') || s.includes('⛔') || s.includes('VENCID') || s.includes('CRÍTICO') || s.includes('FUERA') || s.includes('NO ADJUDICADA') || s.includes('NO ENVIADA')) return 'sem-rojo';
      return 'sem-gris';
    }

    function getEstadoBadgeInfo(estado) {
      var s = String(estado || '').toUpperCase();
      if (s.includes('ADJUDICADA') && !s.includes('NO')) return { cls: 'badge-adjudicada', txt: '🏆 Adjudicada' };
      if (s.includes('NO ADJUDICADA')) return { cls: 'badge-no-adj', txt: '❌ No Adjudicada' };
      if (s.includes('APROBACIÓN') || s.includes('JEFATURA')) return { cls: 'badge-aprobacion', txt: '👔 En Aprobación' };
      if (s.includes('ENVIADA') && !s.includes('NO')) return { cls: 'badge-enviada', txt: '📬 Oferta Enviada' };
      if (s.includes('PAUSA') || s.includes('STANDBY')) return { cls: 'badge-pausa', txt: '⏸️ En Pausa' };
      if (s.includes('DESIST') || s.includes('NO ENVIADA')) return { cls: 'badge-desistida', txt: '⚪ ' + (estado || 'Desistida') };
      return { cls: 'badge-estudio', txt: '📝 ' + (estado || 'En Estudio') };
    }

    function evaluarHitoActivo(item) {
      if (item.estado_global) {
        var eg = String(item.estado_global).toUpperCase();
        var semClass = getSemaforoClass(eg);
        return { hito: 'Estado Global', semaforo: semClass, texto: item.estado_global };
      }

      var est = (item.estado_proceso || '').toUpperCase();
      if (est.includes('ADJUDICADA') && !est.includes('NO')) return { hito: 'Adjudicada', semaforo: 'sem-verde', texto: '🏆 ¡ADJUDICADA!' };
      if (est.includes('NO ADJUDICADA')) return { hito: 'No Adjudicada', semaforo: 'sem-rojo', texto: '❌ No Adjudicada' };
      if (est.includes('APROBACIÓN')) return { hito: 'Aprobación', semaforo: 'sem-morado', texto: '👔 EN APROBACIÓN POR JEFATURA' };
      if (est.includes('PAUSA')) return { hito: 'En Pausa', semaforo: 'sem-naranja', texto: '⏸️ EN PAUSA' };
      if (est.includes('DESIST')) return { hito: 'Desistida', semaforo: 'sem-gris', texto: '⚪ PROCESO DESISTIDO' };
      if (item.f_real_oferta || est.includes('ENVIADA')) return { hito: 'Oferta', semaforo: 'sem-azul', texto: '📬 OFERTA ENVIADA' };

      var hitos = [
        { nombre: 'Reunión Telemática', fecha: item.f_reunion, ok: item.reunion_ok },
        { nombre: 'Visita Terreno', fecha: item.f_visita, ok: item.visita_ok },
        { nombre: 'Envío Preguntas', fecha: item.f_preguntas, ok: item.preguntas_ok },
        { nombre: 'Entrega Oferta', fecha: item.f_oferta, ok: false }
      ];

      for (var i = 0; i < hitos.length; i++) {
        var h = hitos[i];
        var isDone = String(h.ok).toUpperCase() === 'SI' || String(h.ok).toUpperCase() === 'TRUE';
        if (!isDone && h.fecha) {
          var d = diffDays(h.fecha);
          if (d === null) continue;
          if (d < 0) return { hito: h.nombre, dias: d, semaforo: 'sem-rojo', texto: '🔴 ' + h.nombre + ' VENCIDO (' + Math.abs(d) + ' d atrás)' };
          if (d === 0) return { hito: h.nombre, dias: 0, semaforo: 'sem-amarillo', texto: '🟡 ' + h.nombre + ' VENCE HOY' };
          if (d <= 2) return { hito: h.nombre, dias: d, semaforo: 'sem-rojo', texto: '🔴 ' + h.nombre + ' en ' + d + ' días' };
          if (d <= 5) return { hito: h.nombre, dias: d, semaforo: 'sem-amarillo', texto: '🟡 ' + h.nombre + ' en ' + d + ' días' };
          return { hito: h.nombre, dias: d, semaforo: 'sem-verde', texto: '🟢 ' + h.nombre + ' en ' + d + ' días' };
        }
      }

      return { hito: 'En Seguimiento', dias: null, semaforo: 'sem-verde', texto: '🟢 EN CURSO NORMAL' };
    }

    function setLastModifiedDisplay(dateObj, prefix) {
      var dia = ('0' + dateObj.getDate()).slice(-2);
      var mes = ('0' + (dateObj.getMonth() + 1)).slice(-2);
      var anio = dateObj.getFullYear();
      var hora = ('0' + dateObj.getHours()).slice(-2);
      var min = ('0' + dateObj.getMinutes()).slice(-2);
      var seg = ('0' + dateObj.getSeconds()).slice(-2);
      var formatted = dia + '/' + mes + '/' + anio + ' ' + hora + ':' + min + ':' + seg + ' hrs';
      var el = document.getElementById('last-update-display');
      if (el) {
        el.innerHTML = '&#128336; ' + (prefix || 'Sincronizado:') + '<br><strong style="color:#e2e8f0">' + formatted + '</strong>';
      }
    }

    function parseSheetParametros(sheet) {
      if (!sheet) return { servicios: [], mandantes: [] };
      const rows = XLSX.utils.sheet_to_json(sheet, { header: 1 });
      let servicios = [];
      let mandantes = [];
      for (let i = 1; i < rows.length; i++) {
        let r = rows[i];
        if (!r) continue;
        if (r[2] && String(r[2]).trim()) servicios.push(String(r[2]).trim());
        if (r[3] && String(r[3]).trim()) mandantes.push(String(r[3]).trim());
      }
      return { servicios, mandantes };
    }

    function parseSheetLicitaciones(sheet) {
      const rows = XLSX.utils.sheet_to_json(sheet, { header: 1 });
      let list = [];
      let startIdx = 1;
      for (let i = startIdx; i < rows.length; i++) {
        let r = rows[i];
        if (!r || r.length === 0 || (!r[1] && !r[2])) continue;
        
        let id = r[0] || i;
        let cod = r[1] ? String(r[1]).trim() : '';
        let mandante = r[2] ? String(r[2]).trim() : '';
        let proyecto = r[3] ? String(r[3]).trim() : '';
        let tipo_servicio = r[4] ? String(r[4]).trim() : 'Movimiento de tierra con maquinaria';
        let estado_proceso = r[5] ? String(r[5]).trim() : 'En Estudio';
        let f_inicio = formatExcelDate(r[6]);
        let f_reunion = formatExcelDate(r[7]);
        let reunion_ok = r[8] ? String(r[8]).trim() : 'NO';
        let f_visita = formatExcelDate(r[9]);
        let visita_ok = r[10] ? String(r[10]).trim() : 'NO';
        let f_preguntas = formatExcelDate(r[11]);
        let preguntas_ok = r[12] ? String(r[12]).trim() : 'NO';
        let f_oferta = formatExcelDate(r[13]);
        let f_real_oferta = formatExcelDate(r[14]);
        let observaciones = r[15] ? String(r[15]).trim() : '';
        let responsable = r[16] ? String(r[16]).trim() : '';
        let sem_reunion = r[17] ? String(r[17]).trim() : '';
        let sem_visita = r[18] ? String(r[18]).trim() : '';
        let sem_preguntas = r[19] ? String(r[19]).trim() : '';
        let sem_oferta = r[20] ? String(r[20]).trim() : '';
        let estado_global = r[21] ? String(r[21]).trim() : '';

        list.push({
          id, cod, mandante, proyecto, tipo_servicio, estado_proceso,
          f_inicio, f_reunion, reunion_ok, f_visita, visita_ok,
          f_preguntas, preguntas_ok, f_oferta, f_real_oferta,
          observaciones, responsable,
          sem_reunion, sem_visita, sem_preguntas, sem_oferta, estado_global
        });
      }
      return list;
    }

      .then(data => {
        let actual = data.record !== undefined ? data.record : data;
        if (actual && actual.licitaciones && actual.licitaciones.length > 0) {

    function handleExcelUpload(event) {
      const file = event.target.files[0];
      if (!file) return;

      var fileModDate = file.lastModified ? new Date(file.lastModified) : new Date();
      const reader = new FileReader();

      reader.onload = function(e) {
        try {
          const data = new Uint8Array(e.target.result);
          const workbook = XLSX.read(data, { type: 'array' });
          
          const sheetNameLic = workbook.SheetNames.find(s => s.toLowerCase().includes('licitacion')) || workbook.SheetNames[0];
          const sheetNameParam = workbook.SheetNames.find(s => s.toLowerCase().includes('param'));

          let parsedLic = parseSheetLicitaciones(workbook.Sheets[sheetNameLic]);
          let parsedParam = parseSheetParametros(sheetNameParam ? workbook.Sheets[sheetNameParam] : null);

          DATA_LIC = parsedLic;
          if (parsedParam.servicios.length > 0) LISTA_SERVICIOS = parsedParam.servicios;
          if (parsedParam.mandantes.length > 0) LISTA_MANDANTES = parsedParam.mandantes;

          initDashboard();
          setLastModifiedDisplay(fileModDate, 'Actualizado:');

          fetch(NPOINT_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ 
              licitaciones: parsedLic,
              servicios_catalogo: LISTA_SERVICIOS,
              mandantes_catalogo: LISTA_MANDANTES
            })
          })
          .then(res => res.json())
          .then(() => alert("✅ ¡Pipeline de Licitaciones y catálogo de servicios sincronizados con éxito en la nube!"))
          .catch(() => alert("⚠️ Archivo cargado en pantalla localmente."));
        } catch (err) {
          alert("Error procesando el archivo Excel.");
        }
      };
      reader.readAsArrayBuffer(file);
    }

    function updateTabBadgesAndKPIs() {
      var total = DATA_LIC.length;
      var est = 0, aprob = 0, crit = 0, env = 0, pausa = 0, des = 0, adj = 0, noAdj = 0;

      for (var i = 0; i < DATA_LIC.length; i++) {
        var item = DATA_LIC[i];
        var st = (item.estado_proceso || '').toUpperCase();
        var eg = (item.estado_global || '').toUpperCase();

        if (st.includes('ADJUDICADA') && !st.includes('NO')) {
          adj++;
        } else if (st.includes('NO ADJUDICADA')) {
          noAdj++;
        } else if (st.includes('DESIST')) {
          des++;
        } else if (st.includes('PAUSA') || st.includes('STANDBY')) {
          pausa++;
        } else if (st.includes('APROBACIÓN') || st.includes('JEFATURA')) {
          aprob++;
        } else if (item.f_real_oferta || st.includes('ENVIADA')) {
          env++;
        } else if (st.includes('ESTUDIO')) {
          est++;
        }

        var semConcat = (item.sem_reunion || '') + (item.sem_visita || '') + (item.sem_preguntas || '') + (item.sem_oferta || '') + eg;
        if (semConcat.includes('🔴') || semConcat.includes('Crítico') || semConcat.includes('Vencid') || semConcat.includes('Inminente') || semConcat.includes('Hoy') || semConcat.includes('HOY')) {
          if (!st.includes('NO ADJUDICADA') && !st.includes('ADJUDICADA') && !st.includes('DESIST')) {
            crit++;
          }
        }
      }

      document.getElementById('badge-count-todas').textContent = total;
      document.getElementById('badge-count-estudio').textContent = est;
      document.getElementById('badge-count-aprobacion').textContent = aprob;
      document.getElementById('badge-count-critico').textContent = crit;
      document.getElementById('badge-count-enviada').textContent = env;
      document.getElementById('badge-count-pausa').textContent = pausa;
      document.getElementById('badge-count-desistida').textContent = des;
      document.getElementById('badge-count-adjudicada').textContent = adj;
      document.getElementById('badge-count-no-adj').textContent = noAdj;
    }

      else if (state === 'OFERTA ENVIADA') document.getElementById('tab-enviada').classList.add('active-enviada');

    function initDashboard() {
      var mapTipos = {};
      LISTA_SERVICIOS.forEach(s => { if (s) mapTipos[s] = true; });
      for (var i = 0; i < DATA_LIC.length; i++) {
        var t = DATA_LIC[i].tipo_servicio;
        if (t) mapTipos[t] = true;
      }
      var tipos = Object.keys(mapTipos).sort();

      var mapMandantes = {};
      LISTA_MANDANTES.forEach(m => { if (m) mapMandantes[m] = true; });
      for (var i = 0; i < DATA_LIC.length; i++) {
        var m = DATA_LIC[i].mandante;
        if (m) mapMandantes[m] = true;
      }
      var mandantes = Object.keys(mapMandantes).sort();

      var tSelect = document.getElementById('tipoServicioSelect');

      tipos.forEach(t => { var opt = document.createElement('option'); opt.value = t; opt.textContent = t; tSelect.appendChild(opt); });

      var mSelect = document.getElementById('mandanteSelect');
      mSelect.innerHTML = '<option value="TODOS">Todos los mandantes</option>';

    function resetFilters() {
      document.getElementById('searchInput').value = '';
      document.getElementById('tipoServicioSelect').value = 'TODOS';
      document.getElementById('mandanteSelect').value = 'TODOS';
      setTabFilter('TODOS');
    }

    function applyFilters() {
      var search = document.getElementById('searchInput').value.toLowerCase().trim();
      var tipo = document.getElementById('tipoServicioSelect').value;
      var mandante = document.getElementById('mandanteSelect').value;

      var filtered = DATA_LIC.filter(item => {
        var matchSearch = !search || 
          (item.cod && item.cod.toLowerCase().includes(search)) || 
          (item.mandante && item.mandante.toLowerCase().includes(search)) || 
          (item.proyecto && item.proyecto.toLowerCase().includes(search)) ||
          (item.responsable && item.responsable.toLowerCase().includes(search)) ||
          (item.observaciones && item.observaciones.toLowerCase().includes(search));
        
        var matchTipo = (tipo === 'TODOS' || item.tipo_servicio === tipo);
        var matchMandante = (mandante === 'TODOS' || item.mandante === mandante);

        var st = (item.estado_proceso || '').toUpperCase();
        var eg = (item.estado_global || '').toUpperCase();
        
        var matchState = true;
        if (currentFilterState === 'EN ESTUDIO') {
          matchState = st.includes('ESTUDIO');
        } else if (currentFilterState === 'EN APROBACION') {
          matchState = st.includes('APROBACIÓN') || st.includes('JEFATURA');
        } else if (currentFilterState === 'CRITICO') {
          var semConcat = (item.sem_reunion || '') + (item.sem_visita || '') + (item.sem_preguntas || '') + (item.sem_oferta || '') + eg;
          matchState = (semConcat.includes('🔴') || semConcat.includes('Crítico') || semConcat.includes('Vencid') || semConcat.includes('Inminente') || semConcat.includes('Hoy') || semConcat.includes('HOY')) &&
                       !st.includes('NO ADJUDICADA') && !st.includes('ADJUDICADA') && !st.includes('DESIST');
        } else if (currentFilterState === 'OFERTA ENVIADA') {
          matchState = (Boolean(item.f_real_oferta) || st.includes('ENVIADA')) && !st.includes('ADJUDICADA') && !st.includes('NO ADJUDICADA');
        } else if (currentFilterState === 'EN PAUSA') {
          matchState = st.includes('PAUSA') || st.includes('STANDBY');
        } else if (currentFilterState === 'DESISTIDA') {
          matchState = st.includes('DESIST') || st.includes('NO ENVIADA');
        } else if (currentFilterState === 'ADJUDICADA') {
          matchState = st.includes('ADJUDICADA') && !st.includes('NO');
        } else if (currentFilterState === 'NO ADJUDICADA') {
          matchState = st.includes('NO ADJUDICADA');
        }

        return matchSearch && matchTipo && matchMandante && matchState;
      });

      renderList(filtered);
    }

    function openModal(id) {
      var item = DATA_LIC.find(e => e.id === id);
      if (!item) return;

      var evalHito = evaluarHitoActivo(item);
      var badgeInfo = getEstadoBadgeInfo(item.estado_proceso);
      document.getElementById('modalHeaderTitle').textContent = (item.cod || 'LIC') + ' - ' + item.mandante;

      var modalHtml = 
        '<span class="modal-section-title">📌 Proyecto y Mandante</span>' +
        '<div class="modal-grid">' +
          '<div class="meta-item"><span class="meta-label">Mandante</span><span class="meta-val highlight">' + item.mandante + '</span></div>' +
          '<div class="meta-item"><span class="meta-label">Código Licitación</span><span class="meta-val" style="color:#fff; font-weight:700;">' + item.cod + '</span></div>' +
          '<div class="meta-item" style="grid-column: span 2;"><span class="meta-label">Nombre Proyecto / Obra</span><span class="meta-val">' + item.proyecto + '</span></div>' +
          '<div class="meta-item"><span class="meta-label">Tipo de Servicio</span><span class="meta-val">' + item.tipo_servicio + '</span></div>' +
          '<div class="meta-item"><span class="meta-label">Estado Actual</span><span class="meta-val highlight">' + (item.estado_proceso || 'En Estudio') + '</span></div>' +
          '<div class="meta-item" style="grid-column: span 2;"><span class="meta-label">Responsable Asignado</span><span class="meta-val" style="color:#f1f5f9; font-weight:700;">' + (item.responsable ? '👤 ' + item.responsable : 'Sin responsable asignado') + '</span></div>' +
        '</div>' +

        '<span class="modal-section-title">📅 Cronograma de Hitos y Semáforos</span>' +
        '<div class="modal-grid">' +
          '<div class="meta-item"><span class="meta-label">Reunión Telemática</span><span class="meta-val">' + (item.f_reunion || 'N/A') + '<br><small style="color:#38bdf8;">' + (item.sem_reunion || 'Realizada: ' + item.reunion_ok) + '</small></span></div>' +
          '<div class="meta-item"><span class="meta-label">Visita a Terreno</span><span class="meta-val">' + (item.f_visita || 'N/A') + '<br><small style="color:#38bdf8;">' + (item.sem_visita || 'Realizada: ' + item.visita_ok) + '</small></span></div>' +
          '<div class="meta-item"><span class="meta-label">Límite Preguntas</span><span class="meta-val">' + (item.f_preguntas || 'N/A') + '<br><small style="color:#38bdf8;">' + (item.sem_preguntas || 'Enviadas: ' + item.preguntas_ok) + '</small></span></div>' +
          '<div class="meta-item"><span class="meta-label">Límite Oferta</span><span class="meta-val highlight">' + (item.f_oferta || 'N/A') + '<br><small style="color:#38bdf8;">' + (item.sem_oferta || '') + '</small></span></div>' +
          '<div class="meta-item" style="grid-column: span 2;"><span class="meta-label">Fecha Real de Envío Oferta</span><span class="meta-val" style="color:#34d399; font-weight:700;">' + (item.f_real_oferta ? '📬 ' + item.f_real_oferta : 'No enviada aún') + '</span></div>' +
        '</div>' +

        '<span class="modal-section-title">🚦 Diagnóstico y Estado Global</span>' +
        '<div style="display:flex; align-items:center; justify-content:space-between; background:rgba(11, 19, 41, 0.6); padding:12px; border-radius:10px; border:1px solid var(--border-color);">' +
          '<span style="font-size:12px; color:var(--text-muted); font-weight:600;">Estado Global:</span>' +
          '<span class="alert-tag ' + evalHito.semaforo + '">' + evalHito.texto + '</span>' +
        '</div>' +

        (item.observaciones ? 
          '<div style="background:rgba(59, 130, 246, 0.1); border:1px solid rgba(59, 130, 246, 0.3); border-radius:10px; padding:12px;">' +
            '<span class="meta-label" style="color:#93c5fd;">📝 Observaciones del Proceso:</span>' +
            '<p style="font-size:12px; color:#e2e8f0; margin-top:4px; line-height:1.5;">' + item.observaciones + '</p>' +
          '</div>' : '');

      document.getElementById('modalBodyContent').innerHTML = modalHtml;
      document.getElementById('licitacionModal').classList.add('active');
    }

    function closeModal(e) { if (e.target.id === 'licitacionModal') document.getElementById('licitacionModal').classList.remove('active'); }
    function closeModalDirect() { document.getElementById('licitacionModal').classList.remove('active'); }

    window.addEventListener('DOMContentLoaded', () => syncCloudData());
  </script>
</body>
</html>
