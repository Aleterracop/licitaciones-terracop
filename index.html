<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="google" content="notranslate">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Grupo Terracop - Gestión y Control de Licitaciones</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <style>
    :root {
      --bg-main: #0b1329;
      --bg-card: #152238;
      --bg-card-hover: #1c2d4a;
      --bg-surface: #0f1c32;
      --border-color: #243859;
      --border-light: #334e77;
      --text-main: #f1f5f9;
      --text-muted: #94a3b8;
      --text-dim: #64748b;
      --accent-blue: #3b82f6;
      --accent-green: #10b981;
      --accent-orange: #f59e0b;
      --accent-red: #ef4444;
      --accent-purple: #8b5cf6;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background-color: var(--bg-main); color: var(--text-main); min-height: 100vh; display: flex; justify-content: center; padding: 12px; }
    .app-container { width: 100%; max-width: 960px; display: flex; flex-direction: column; gap: 14px; }
    
    .header-bar { display: flex; align-items: center; justify-content: space-between; background: linear-gradient(135deg, #182640 0%, #0d1728 100%); padding: 14px 18px; border-radius: 16px; border: 1px solid var(--border-color); box-shadow: 0 6px 24px rgba(0, 0, 0, 0.4); flex-wrap: wrap; gap: 12px; }
    .brand-group { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
    .brand-logo-card { background: #ffffff; padding: 6px 14px; border-radius: 10px; display: inline-flex; align-items: center; justify-content: center; border: 1px solid rgba(255, 255, 255, 0.2); }
    .brand-logo-card svg { height: 40px; width: auto; display: block; }
    .header-title-box { display: flex; flex-direction: column; }
    .header-title { font-size: 16px; font-weight: 900; text-transform: uppercase; letter-spacing: 0.8px; color: #ffffff; }
    .header-sub { font-size: 11px; color: #38bdf8; font-weight: 600; }
    
    .header-actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .btn-upload { background: #059669; color: #fff; border: none; padding: 7px 14px; border-radius: 20px; font-size: 11.5px; font-weight: 700; cursor: pointer; display: flex; align-items: center; gap: 5px; transition: 0.2s; }
    .btn-upload:hover { background: #10b981; }
    .sync-status { display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--accent-green); background: rgba(16, 185, 129, 0.12); padding: 6px 12px; border-radius: 20px; border: 1px solid rgba(16, 185, 129, 0.25); }
    .sync-dot { width: 8px; height: 8px; background-color: var(--accent-green); border-radius: 50%; box-shadow: 0 0 8px var(--accent-green); animation: pulse 1.8s infinite; }
    @keyframes pulse { 0% { transform: scale(0.9); opacity: 0.6; } 50% { transform: scale(1.3); opacity: 1; } 100% { transform: scale(0.9); opacity: 0.6; } }

    .kpi-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
    @media (min-width: 750px) { .kpi-grid { grid-template-columns: repeat(5, 1fr); } }
    .kpi-card { background: var(--bg-card); border-radius: 14px; padding: 12px 14px; border: 1px solid var(--border-color); display: flex; align-items: center; gap: 10px; cursor: pointer; transition: all 0.2s; }
    .kpi-card:hover, .kpi-card.active { transform: translateY(-2px); border-color: var(--border-light); background: var(--bg-card-hover); }
    .kpi-card.active { box-shadow: 0 0 0 2px var(--accent-blue); }
    .kpi-icon-wrap { width: 38px; height: 38px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 17px; flex-shrink: 0; }
    .kpi-estudio { background: rgba(59, 130, 246, 0.18); color: #60a5fa; border: 1px solid rgba(59, 130, 246, 0.3); }
    .kpi-critico { background: rgba(239, 68, 68, 0.18); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.3); }
    .kpi-enviada { background: rgba(56, 189, 248, 0.18); color: #38bdf8; border: 1px solid rgba(56, 189, 248, 0.3); }
    .kpi-adjudicada { background: rgba(16, 185, 129, 0.2); color: #34d399; border: 1px solid rgba(16, 185, 129, 0.4); }
    .kpi-no-adj { background: rgba(239, 68, 68, 0.15); color: #fca5a5; border: 1px solid rgba(239, 68, 68, 0.3); }
    .kpi-info { display: flex; flex-direction: column; }
    .kpi-label { font-size: 9.5px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; }
    .kpi-value { font-size: 19px; font-weight: 900; line-height: 1.2; }

    .filters-section { background: var(--bg-surface); border: 1px solid var(--border-color); border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 12px; }
    .filters-grid { display: grid; grid-template-columns: 1fr; gap: 10px; }
    @media (min-width: 650px) { .filters-grid { grid-template-columns: repeat(3, 1fr); } }
    .filter-group { display: flex; flex-direction: column; gap: 5px; }
    .filter-label { font-size: 10px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; }
    .custom-select, .search-input { background-color: #121e33; border: 1px solid var(--border-color); color: #e2e8f0; font-size: 13px; font-weight: 500; border-radius: 8px; padding: 9px 12px; outline: none; width: 100%; }
    .custom-select:focus, .search-input:focus { border-color: var(--accent-blue); }
    .filter-actions { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-top: 4px; }
    .btn-reset { background: #1e3a8a; color: white; font-weight: 700; font-size: 12px; border: none; padding: 8px 16px; border-radius: 8px; cursor: pointer; }
    .results-count { font-size: 12px; color: var(--text-muted); font-weight: 600; }

    .cards-container { display: flex; flex-direction: column; gap: 12px; }
    .lic-card { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 14px; padding: 16px; display: flex; flex-direction: column; gap: 12px; cursor: pointer; transition: all 0.2s ease; position: relative; }
    .lic-card:hover { border-color: var(--accent-blue); transform: translateY(-2px); box-shadow: 0 6px 18px rgba(0, 0, 0, 0.35); }
    .card-top-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
    .mandante-title { font-weight: 800; font-size: 16px; color: #ffffff; display: flex; align-items: center; gap: 8px; }
    .badge-code { background: #0f172a; border: 1px solid var(--border-light); color: #38bdf8; font-weight: 800; font-size: 11px; padding: 3px 8px; border-radius: 6px; }
    
    .status-badge { font-size: 11px; font-weight: 800; padding: 4px 10px; border-radius: 20px; display: inline-flex; align-items: center; gap: 5px; text-transform: uppercase; }
    .badge-estudio { background: rgba(59, 130, 246, 0.18); color: #93c5fd; border: 1px solid rgba(59, 130, 246, 0.4); }
    .badge-enviada { background: rgba(56, 189, 248, 0.18); color: #7dd3fc; border: 1px solid rgba(56, 189, 248, 0.4); }
    .badge-adjudicada { background: rgba(16, 185, 129, 0.25); color: #34d399; border: 1px solid #10b981; }
    .badge-no-adj { background: rgba(239, 68, 68, 0.2); color: #fca5a5; border: 1px solid rgba(239, 68, 68, 0.4); }
    .badge-desistida { background: rgba(148, 163, 184, 0.15); color: #cbd5e1; border: 1px solid rgba(148, 163, 184, 0.3); }
    .badge-standby { background: rgba(139, 92, 246, 0.2); color: #c4b5fd; border: 1px solid rgba(139, 92, 246, 0.4); }

    .project-name { font-size: 13.5px; font-weight: 600; color: #cbd5e1; line-height: 1.4; }
    .service-tag { display: inline-block; background: rgba(56, 189, 248, 0.1); color: #38bdf8; font-size: 11px; font-weight: 700; padding: 3px 8px; border-radius: 6px; width: fit-content; border: 1px solid rgba(56, 189, 248, 0.25); }

    .timeline-strip { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; background: rgba(11, 19, 41, 0.5); padding: 10px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.04); }
    .step-item { display: flex; flex-direction: column; gap: 2px; text-align: center; }
    .step-label { font-size: 9.5px; color: var(--text-dim); font-weight: 700; text-transform: uppercase; }
    .step-val { font-size: 11.5px; font-weight: 700; color: #94a3b8; }
    .step-done { color: #34d399 !important; }
    .step-target { color: #facc15 !important; }

    .card-footer-alert { display: flex; align-items: center; justify-content: space-between; gap: 10px; font-size: 11.5px; padding-top: 8px; border-top: 1px dashed var(--border-color); }
    .alert-tag { font-weight: 800; padding: 3px 9px; border-radius: 5px; font-size: 11px; display: inline-flex; align-items: center; gap: 4px; }
    .alert-red { background: rgba(239, 68, 68, 0.25); color: #fca5a5; border: 1px solid rgba(239, 68, 68, 0.4); }
    .alert-yellow { background: rgba(245, 158, 11, 0.25); color: #fde68a; border: 1px solid rgba(245, 158, 11, 0.4); }
    .alert-green { background: rgba(16, 185, 129, 0.25); color: #6ee7b7; border: 1px solid rgba(16, 185, 129, 0.4); }
    .alert-gray { background: rgba(148, 163, 184, 0.2); color: #94a3b8; border: 1px solid rgba(148, 163, 184, 0.3); }

    .modal-overlay { position: fixed; inset: 0; background: rgba(4, 9, 20, 0.85); backdrop-filter: blur(5px); display: none; align-items: center; justify-content: center; z-index: 9999; padding: 16px; }
    .modal-overlay.active { display: flex; }
    .modal-container { background: #152238; border: 1px solid var(--border-light); border-radius: 16px; width: 100%; max-width: 600px; box-shadow: 0 10px 40px rgba(0,0,0,0.6); display: flex; flex-direction: column; overflow: hidden; }
    .modal-header { background: #182640; padding: 14px 18px; border-bottom: 1px solid var(--border-color); display: flex; align-items: center; justify-content: space-between; }
    .modal-title { font-size: 15px; font-weight: 800; color: #ffffff; }
    .btn-close-modal { background: transparent; border: none; color: var(--text-muted); font-size: 20px; cursor: pointer; padding: 4px; }
    .modal-body { padding: 18px; display: flex; flex-direction: column; gap: 14px; max-height: 80vh; overflow-y: auto; }
    .modal-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; background: rgba(11, 19, 41, 0.6); border: 1px solid var(--border-color); padding: 14px; border-radius: 10px; }
    .modal-section-title { font-size: 11px; font-weight: 800; color: #38bdf8; text-transform: uppercase; margin-bottom: -4px; }
    .meta-item { display: flex; flex-direction: column; gap: 2px; }
    .meta-label { font-size: 10px; color: var(--text-dim); font-weight: 600; text-transform: uppercase; }
    .meta-val { color: #cbd5e1; font-weight: 500; font-size: 12.5px; }
    .meta-val.highlight { color: #38bdf8; font-weight: 700; }
  </style>
</head>
<body>
  <div class="app-container">
    <header class="header-bar">
      <div class="brand-group">
        <div class="brand-logo-card">
          <svg viewBox="0 0 280 85" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M4 14 L38 14 C48 14 55 24 50 36 L24 80 C21 85 14 85 12 80 L3 58 C1 54 2 49 6 46 L36 24 C40 21 38 16 33 16 L4 16 Z" fill="url(#terraGrad)" />
            <path d="M48 6 H76 V28 H48 Z" fill="#182c4d" />
            <defs>
              <linearGradient id="terraGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#1e3a8a" />
                <stop offset="45%" stop-color="#38bdf8" />
                <stop offset="100%" stop-color="#0284c7" />
              </linearGradient>
            </defs>
            <text x="86" y="32" font-family="'Inter', sans-serif" font-weight="900" font-size="25" fill="#0284c7" letter-spacing="2">GRUPO</text>
            <text x="86" y="68" font-family="'Inter', sans-serif" font-weight="900" font-size="34" fill="#111c38" letter-spacing="1">terracop</text>
          </svg>
        </div>
        <div class="header-title-box">
          <h1 class="header-title">Pipeline de Licitaciones</h1>
          <span class="header-sub">Gestión Comercial y Control de Fechas Críticas</span>
        </div>
      </div>
      <div class="header-actions">
        <input type="file" id="excelUploadInput" accept=".xlsx, .xls" style="display:none;" onchange="handleExcelUpload(event)" />
        <button type="button" class="btn-upload" onclick="document.getElementById('excelUploadInput').click()">
          📁 Cargar Nuevo Excel
        </button>
        <div id="last-update-display" style="font-size:10.5px; color:#94a3b8; font-weight:600; padding:6px 12px; background:rgba(255,255,255,0.05); border-radius:20px; border:1px solid rgba(255,255,255,0.1); white-space:nowrap;">
          🕐 Sincronizando...
        </div>
        <div class="sync-status">
          <div class="sync-dot"></div>
          <span>En Línea</span>
        </div>
      </div>
    </header>

    <section class="kpi-grid">
      <div class="kpi-card" id="kpi-estudio" onclick="filterByState('EN ESTUDIO')">
        <div class="kpi-icon-wrap kpi-estudio">📝</div>
        <div class="kpi-info"><span class="kpi-label">En Estudio</span><span class="kpi-value" id="count-estudio">0</span></div>
      </div>
      <div class="kpi-card" id="kpi-critico" onclick="filterByState('CRITICO')">
        <div class="kpi-icon-wrap kpi-critico">🚨</div>
        <div class="kpi-info"><span class="kpi-label">Hitos ≤ 2 Días</span><span class="kpi-value" id="count-critico">0</span></div>
      </div>
      <div class="kpi-card" id="kpi-enviada" onclick="filterByState('OFERTA ENVIADA')">
        <div class="kpi-icon-wrap kpi-enviada">📬</div>
        <div class="kpi-info"><span class="kpi-label">En Espera</span><span class="kpi-value" id="count-enviada">0</span></div>
      </div>
      <div class="kpi-card" id="kpi-adjudicada" onclick="filterByState('ADJUDICADA')">
        <div class="kpi-icon-wrap kpi-adjudicada">🏆</div>
        <div class="kpi-info"><span class="kpi-label">Adjudicadas</span><span class="kpi-value" id="count-adjudicada">0</span></div>
      </div>
      <div class="kpi-card" id="kpi-no-adj" onclick="filterByState('NO ADJUDICADA')">
        <div class="kpi-icon-wrap kpi-no-adj">❌</div>
        <div class="kpi-info"><span class="kpi-label">No Adjudicadas</span><span class="kpi-value" id="count-no-adj">0</span></div>
      </div>
    </section>

    <section class="filters-section">
      <div class="filters-grid">
        <div class="filter-group">
          <label class="filter-label">Buscar (Proyecto / Código / Mandante)</label>
          <input type="text" id="searchInput" class="search-input" placeholder="Ej: Candelaria, LIC-2026, Caminos..." oninput="applyFilters()" />
        </div>
        <div class="filter-group">
          <label class="filter-label">Tipo de Servicio</label>
          <select id="tipoServicioSelect" class="custom-select" onchange="applyFilters()"><option value="TODOS">Todos los servicios</option></select>
        </div>
        <div class="filter-group">
          <label class="filter-label">Mandante / Cliente</label>
          <select id="mandanteSelect" class="custom-select" onchange="applyFilters()"><option value="TODOS">Todos los mandantes</option></select>
        </div>
      </div>
      <div class="filter-actions">
        <button type="button" class="btn-reset" onclick="resetFilters()">🔄 Limpiar Filtros</button>
        <span class="results-count" id="resultsCount">Cargando licitaciones...</span>
      </div>
    </section>

    <main class="cards-container" id="licitacionesList"></main>
  </div>

  <div id="licitacionModal" class="modal-overlay" onclick="closeModal(event)">
    <div class="modal-container" onclick="event.stopPropagation()">
      <div class="modal-header">
        <div class="modal-title" id="modalHeaderTitle">Detalle de Licitación</div>
        <button type="button" class="btn-close-modal" onclick="closeModalDirect()">✕</button>
      </div>
      <div class="modal-body" id="modalBodyContent"></div>
    </div>
  </div>

  <script>
    // Enlace exclusivo de npoint configurado para licitaciones
    const NPOINT_URL = 'https://api.npoint.io/6c291be30d583b512a2e';

    let DATA_LIC = [];
    let currentFilterState = 'TODOS';

    function parseDateObj(val) {
      if (!val && val !== 0) return null;
      if (val instanceof Date) return isNaN(val.getTime()) ? null : val;
      if (typeof val === 'number' || (!isNaN(val) && !isNaN(parseFloat(val)) && String(val).trim().length <= 6)) {
        var num = parseFloat(val);
        var date = new Date(Math.round((num - 25569) * 86400 * 1000));
        var userOffset = date.getTimezoneOffset() * 60000;
        return new Date(date.getTime() + userOffset);
      }
      var s = String(val).trim();
      var matchDMY = s.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})/);
      if (matchDMY) {
        return new Date(parseInt(matchDMY[3], 10), parseInt(matchDMY[2], 10) - 1, parseInt(matchDMY[1], 10));
      }
      var parsed = new Date(s);
      return isNaN(parsed.getTime()) ? null : parsed;
    }

    function formatExcelDate(val) {
      if (!val && val !== 0) return '';
      var s = String(val).trim();
      if (!s || s.toLowerCase().includes('nan') || s.toLowerCase().includes('nat') || s.toLowerCase().includes('sin')) return '';

      var matchHora = s.match(/\b\d{1,2}:\d{2}\b/);
      var strHora = matchHora ? ' (' + matchHora[0] + ' hrs)' : '';

      var matchDMY = s.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})/);
      if (matchDMY) {
        var d = ('0' + matchDMY[1]).slice(-2);
        var m = ('0' + matchDMY[2]).slice(-2);
        return d + '/' + m + '/' + matchDMY[3] + strHora;
      }

      var dObj = parseDateObj(val);
      if (dObj) {
        var dia = ('0' + dObj.getDate()).slice(-2);
        var mes = ('0' + (dObj.getMonth() + 1)).slice(-2);
        var anio = dObj.getFullYear();
        return dia + '/' + mes + '/' + anio + strHora;
      }

      return s;
    }

    function diffDays(targetDate) {
      var d = parseDateObj(targetDate);
      if (!d) return null;
      var now = new Date();
      var tNow = new Date(now.getFullYear(), now.getMonth(), now.getDate()).getTime();
      var tTarget = new Date(d.getFullYear(), d.getMonth(), d.getDate()).getTime();
      return Math.round((tTarget - tNow) / (1000 * 60 * 60 * 24));
    }

    function evaluarHitoActivo(item) {
      var est = (item.estado_proceso || '').toUpperCase();
      var ver = (item.veredicto || '').toUpperCase();

      if (est.includes('ADJUDICADA') || ver === 'ADJUDICADA' || ver.includes('GANADA')) {
        return { hito: 'Adjudicada', dias: null, semaforo: 'alert-green', texto: '🏆 ¡ADJUDICADA!' };
      }
      if (est.includes('NO ADJUDICADA') || ver === 'NO ADJUDICADA' || ver.includes('PERDIDA')) {
        return { hito: 'No Adjudicada', dias: null, semaforo: 'alert-red', texto: '❌ No Adjudicada' };
      }
      if (est.includes('DESIST')) {
        return { hito: 'Desistida', dias: null, semaforo: 'alert-gray', texto: '⚪ Proceso Desistido' };
      }

      if (item.f_real_oferta || est.includes('ENVIADA')) {
        var dRes = diffDays(item.f_resultado);
        var txtResultado = item.f_resultado ? ' (Estimada: ' + item.f_resultado + ')' : '';
        if (dRes !== null && dRes < 0) {
          return { hito: 'Resultado', dias: dRes, semaforo: 'alert-yellow', texto: '📬 Oferta Enviada • Esperando resultado con demora' };
        }
        return { hito: 'Resultado', dias: dRes, semaforo: 'alert-green', texto: '📬 Oferta Enviada • Esperando resultado' + txtResultado };
      }

      var hitos = [
        { nombre: 'Reunión Telemática', fecha: item.f_reunion, ok: item.reunion_ok },
        { nombre: 'Visita Terreno', fecha: item.f_visita, ok: item.visita_ok },
        { nombre: 'Envío Preguntas', fecha: item.f_preguntas, ok: item.preguntas_ok },
        { nombre: 'Entrega Oferta', fecha: item.f_oferta, ok: false }
      ];

      for (var i = 0; i < hitos.length; i++) {
        var h = hitos[i];
        var isDone = String(h.ok).toUpperCase() === 'SI' || String(h.ok).toUpperCase() === 'TRUE';
        if (!isDone && h.fecha) {
          var d = diffDays(h.fecha);
          if (d === null) continue;
          if (d < 0) return { hito: h.nombre, dias: d, semaforo: 'alert-red', texto: '🔴 ' + h.nombre + ' VENCIDO (' + Math.abs(d) + ' d atrás)' };
          if (d === 0) return { hito: h.nombre, dias: 0, semaforo: 'alert-yellow', texto: '🟡 ' + h.nombre + ' VENCE HOY' };
          if (d <= 2) return { hito: h.nombre, dias: d, semaforo: 'alert-red', texto: '🔴 ' + h.nombre + ' en ' + d + ' días' };
          if (d <= 5) return { hito: h.nombre, dias: d, semaforo: 'alert-yellow', texto: '🟡 ' + h.nombre + ' en ' + d + ' días' };
          return { hito: h.nombre, dias: d, semaforo: 'alert-green', texto: '🟢 ' + h.nombre + ' en ' + d + ' días' };
        }
      }

      return { hito: 'En Seguimiento', dias: null, semaforo: 'alert-gray', texto: 'En Proceso' };
    }

    function setLastModifiedDisplay(dateObj, prefix) {
      var dia = ('0' + dateObj.getDate()).slice(-2);
      var mes = ('0' + (dateObj.getMonth() + 1)).slice(-2);
      var anio = dateObj.getFullYear();
      var hora = ('0' + dateObj.getHours()).slice(-2);
      var min = ('0' + dateObj.getMinutes()).slice(-2);
      var seg = ('0' + dateObj.getSeconds()).slice(-2);
      var formatted = dia + '/' + mes + '/' + anio + ' ' + hora + ':' + min + ':' + seg + ' hrs';
      var el = document.getElementById('last-update-display');
      if (el) {
        el.innerHTML = '&#128336; ' + (prefix || 'Sincronizado:') + '<br><strong style="color:#e2e8f0">' + formatted + '</strong>';
      }
    }

    function parseSheetLicitaciones(sheet) {
      const rows = XLSX.utils.sheet_to_json(sheet, { header: 1 });
      let list = [];
      let startIdx = 1;
      for (let i = startIdx; i < rows.length; i++) {
        let r = rows[i];
        if (!r || r.length === 0 || !r[1]) continue;
        
        let id = r[0] || i;
        let cod = r[1] ? String(r[1]).trim() : '';
        let mandante = r[2] ? String(r[2]).trim() : '';
        let proyecto = r[3] ? String(r[3]).trim() : '';
        let tipo_servicio = r[4] ? String(r[4]).trim() : 'General';
        let estado_proceso = r[5] ? String(r[5]).trim() : 'En Estudio';
        let f_inicio = formatExcelDate(r[6]);
        let f_reunion = formatExcelDate(r[7]);
        let reunion_ok = r[8] ? String(r[8]).trim() : 'NO';
        let f_visita = formatExcelDate(r[9]);
        let visita_ok = r[10] ? String(r[10]).trim() : 'NO';
        let f_preguntas = formatExcelDate(r[11]);
        let preguntas_ok = r[12] ? String(r[12]).trim() : 'NO';
        let f_oferta = formatExcelDate(r[13]);
        let f_real_oferta = formatExcelDate(r[14]);
        let f_resultado = formatExcelDate(r[15]);
        let veredicto = r[16] ? String(r[16]).trim() : 'Pendiente';
        let motivo_desistimiento = r[17] ? String(r[17]).trim() : '';

        list.push({
          id, cod, mandante, proyecto, tipo_servicio, estado_proceso,
          f_inicio, f_reunion, reunion_ok, f_visita, visita_ok,
          f_preguntas, preguntas_ok, f_oferta, f_real_oferta,
          f_resultado, veredicto, motivo_desistimiento
        });
      }
      return list;
    }

    function syncCloudData() {
      fetch(NPOINT_URL)
      .then(res => res.json())
      .then(data => {
        let actual = data.record !== undefined ? data.record : data;
        if (actual && actual.licitaciones && actual.licitaciones.length > 0) {
          DATA_LIC = actual.licitaciones;
          initDashboard();
          setLastModifiedDisplay(new Date(), 'Sincronizado Web:');
        } else {
          loadFallbackData();
        }
      })
      .catch(() => loadFallbackData());
    }

    function handleExcelUpload(event) {
      const file = event.target.files[0];
      if (!file) return;

      var fileModDate = file.lastModified ? new Date(file.lastModified) : new Date();
      const reader = new FileReader();

      reader.onload = function(e) {
        try {
          const data = new Uint8Array(e.target.result);
          const workbook = XLSX.read(data, { type: 'array' });
          const sheetName = workbook.SheetNames.find(s => s.toLowerCase().includes('licitacion')) || workbook.SheetNames[0];
          
          let parsed = parseSheetLicitaciones(workbook.Sheets[sheetName]);
          DATA_LIC = parsed;
          initDashboard();
          setLastModifiedDisplay(fileModDate, 'Actualizado:');

          fetch(NPOINT_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ licitaciones: parsed })
          })
          .then(res => res.json())
          .then(() => alert("✅ ¡Pipeline de Licitaciones sincronizado con éxito en la nube!"))
          .catch(() => alert("⚠️ Licitaciones cargadas en pantalla localmente."));
        } catch (err) {
          alert("Error procesando el archivo Excel.");
        }
      };
      reader.readAsArrayBuffer(file);
    }

    function initDashboard() {
      var tipos = [];
      var mandantes = [];
      for (var i = 0; i < DATA_LIC.length; i++) {
        var t = DATA_LIC[i].tipo_servicio;
        var m = DATA_LIC[i].mandante;
        if (t && tipos.indexOf(t) === -1) tipos.push(t);
        if (m && mandantes.indexOf(m) === -1) mandantes.push(m);
      }
      tipos.sort(); mandantes.sort();

      var tSelect = document.getElementById('tipoServicioSelect');
      tSelect.innerHTML = '<option value="TODOS">Todos los servicios</option>';
      tipos.forEach(t => { var opt = document.createElement('option'); opt.value = t; opt.textContent = t; tSelect.appendChild(opt); });

      var mSelect = document.getElementById('mandanteSelect');
      mSelect.innerHTML = '<option value="TODOS">Todos los mandantes</option>';
      mandantes.forEach(m => { var opt = document.createElement('option'); opt.value = m; opt.textContent = m; mSelect.appendChild(opt); });

      calculateKPIs();
      applyFilters();
    }

    function calculateKPIs() {
      var est = 0, crit = 0, env = 0, adj = 0, noAdj = 0;
      for (var i = 0; i < DATA_LIC.length; i++) {
        var item = DATA_LIC[i];
        var st = (item.estado_proceso || '').toUpperCase();
        var ver = (item.veredicto || '').toUpperCase();
        var evalHito = evaluarHitoActivo(item);

        if (st.includes('ADJUDICADA') || ver === 'ADJUDICADA' || ver.includes('GANADA')) adj++;
        else if (st.includes('NO ADJUDICADA') || ver === 'NO ADJUDICADA' || ver.includes('PERDIDA')) noAdj++;
        else if (item.f_real_oferta || st.includes('ENVIADA')) env++;
        else if (!st.includes('DESIST')) est++;

        if (evalHito.semaforo === 'alert-red' && !st.includes('NO ADJUDICADA') && !ver.includes('NO ADJUDICADA')) crit++;
      }
      document.getElementById('count-estudio').textContent = est;
      document.getElementById('count-critico').textContent = crit;
      document.getElementById('count-enviada').textContent = env;
      document.getElementById('count-adjudicada').textContent = adj;
      document.getElementById('count-no-adj').textContent = noAdj;
    }

    function filterByState(st) {
      currentFilterState = (currentFilterState === st) ? 'TODOS' : st;
      document.querySelectorAll('.kpi-card').forEach(c => c.classList.remove('active'));
      if (currentFilterState === 'EN ESTUDIO') document.getElementById('kpi-estudio').classList.add('active');
      if (currentFilterState === 'CRITICO') document.getElementById('kpi-critico').classList.add('active');
      if (currentFilterState === 'OFERTA ENVIADA') document.getElementById('kpi-enviada').classList.add('active');
      if (currentFilterState === 'ADJUDICADA') document.getElementById('kpi-adjudicada').classList.add('active');
      if (currentFilterState === 'NO ADJUDICADA') document.getElementById('kpi-no-adj').classList.add('active');
      applyFilters();
    }

    function resetFilters() {
      document.getElementById('searchInput').value = '';
      document.getElementById('tipoServicioSelect').value = 'TODOS';
      document.getElementById('mandanteSelect').value = 'TODOS';
      currentFilterState = 'TODOS';
      document.querySelectorAll('.kpi-card').forEach(c => c.classList.remove('active'));
      applyFilters();
    }

    function applyFilters() {
      var search = document.getElementById('searchInput').value.toLowerCase().trim();
      var tipo = document.getElementById('tipoServicioSelect').value;
      var mandante = document.getElementById('mandanteSelect').value;

      var filtered = DATA_LIC.filter(item => {
        var matchSearch = !search || 
          item.cod.toLowerCase().includes(search) || 
          item.mandante.toLowerCase().includes(search) || 
          item.proyecto.toLowerCase().includes(search);
        
        var matchTipo = (tipo === 'TODOS' || item.tipo_servicio === tipo);
        var matchMandante = (mandante === 'TODOS' || item.mandante === mandante);

        var st = (item.estado_proceso || '').toUpperCase();
        var ver = (item.veredicto || '').toUpperCase();
        var evalHito = evaluarHitoActivo(item);
        
        var matchState = true;
        if (currentFilterState === 'EN ESTUDIO') {
          matchState = st.includes('ESTUDIO') && !item.f_real_oferta && !st.includes('ADJUDICADA') && !ver.includes('ADJUDICADA');
        } else if (currentFilterState === 'CRITICO') {
          matchState = evalHito.semaforo === 'alert-red' && !st.includes('NO ADJUDICADA') && !ver.includes('NO ADJUDICADA');
        } else if (currentFilterState === 'OFERTA ENVIADA') {
          matchState = (Boolean(item.f_real_oferta) || st.includes('ENVIADA')) && !st.includes('ADJUDICADA') && !ver.includes('ADJUDICADA') && !st.includes('NO ADJUDICADA');
        } else if (currentFilterState === 'ADJUDICADA') {
          matchState = st.includes('ADJUDICADA') || ver === 'ADJUDICADA' || ver.includes('GANADA');
        } else if (currentFilterState === 'NO ADJUDICADA') {
          matchState = st.includes('NO ADJUDICADA') || ver === 'NO ADJUDICADA' || ver.includes('PERDIDA');
        }

        return matchSearch && matchTipo && matchMandante && matchState;
      });

      renderList(filtered);
    }

    function renderList(list) {
      var container = document.getElementById('licitacionesList');
      document.getElementById('resultsCount').textContent = 'Mostrando ' + list.length + ' de ' + DATA_LIC.length + ' procesos';

      if (list.length === 0) {
        container.innerHTML = '<div style="text-align:center; padding:35px; color:var(--text-dim); background:var(--bg-card); border-radius:12px; border:1px dashed var(--border-color);">🔍 No se encontraron licitaciones con los filtros seleccionados.</div>';
        return;
      }

      var html = '';
      list.forEach(item => {
        var evalHito = evaluarHitoActivo(item);
        var st = (item.estado_proceso || '').toUpperCase();
        var ver = (item.veredicto || '').toUpperCase();

        var badgeClass = 'badge-estudio';
        var badgeText = item.estado_proceso || 'En Estudio';

        if (st.includes('ADJUDICADA') || ver === 'ADJUDICADA' || ver.includes('GANADA')) {
          badgeClass = 'badge-adjudicada';
          badgeText = '🏆 Adjudicada';
        } else if (st.includes('NO ADJUDICADA') || ver === 'NO ADJUDICADA' || ver.includes('PERDIDA')) {
          badgeClass = 'badge-no-adj';
          badgeText = '❌ No Adjudicada';
        } else if (st.includes('STANDBY')) {
          badgeClass = 'badge-standby';
          badgeText = '⏸️ Standby';
        } else if (st.includes('DESIST')) {
          badgeClass = 'badge-desistida';
          badgeText = '⚪ Desistida';
        } else if (item.f_real_oferta || st.includes('ENVIADA')) {
          badgeClass = 'badge-enviada';
          badgeText = '📬 Oferta Enviada';
        }

        var rOk = String(item.reunion_ok).toUpperCase() === 'SI';
        var vOk = String(item.visita_ok).toUpperCase() === 'SI';
        var pOk = String(item.preguntas_ok).toUpperCase() === 'SI';
        var oOk = Boolean(item.f_real_oferta);

        html += '<div class="lic-card" onclick="openModal(' + item.id + ')">' +
          '<div class="card-top-row">' +
            '<div class="mandante-title"><span class="badge-code">' + (item.cod || 'LIC') + '</span> ' + item.mandante + '</div>' +
            '<div class="status-badge ' + badgeClass + '">' + badgeText + '</div>' +
          '</div>' +
          '<div class="project-name">' + item.proyecto + '</div>' +
          '<div><span class="service-tag">⚙️ ' + item.tipo_servicio + '</span></div>' +
          
          '<div class="timeline-strip">' +
            '<div class="step-item"><span class="step-label">Reunión</span><span class="step-val ' + (rOk ? 'step-done' : '') + '">' + (rOk ? '✓ Hecha' : (item.f_reunion ? item.f_reunion.split(' ')[0] : '-')) + '</span></div>' +
            '<div class="step-item"><span class="step-label">Visita</span><span class="step-val ' + (vOk ? 'step-done' : '') + '">' + (vOk ? '✓ Hecha' : (item.f_visita ? item.f_visita.split(' ')[0] : '-')) + '</span></div>' +
            '<div class="step-item"><span class="step-label">Preguntas</span><span class="step-val ' + (pOk ? 'step-done' : '') + '">' + (pOk ? '✓ Enviadas' : (item.f_preguntas ? item.f_preguntas.split(' ')[0] : '-')) + '</span></div>' +
            '<div class="step-item"><span class="step-label">Oferta</span><span class="step-val ' + (oOk ? 'step-done' : 'step-target') + '">' + (oOk ? '✓ Enviada' : (item.f_oferta ? item.f_oferta.split(' ')[0] : '-')) + '</span></div>' +
          '</div>' +

          '<div class="card-footer-alert">' +
            '<span style="color:var(--text-muted); font-size:11px;">Diagnóstico de hito:</span>' +
            '<span class="alert-tag ' + evalHito.semaforo + '">' + evalHito.texto + '</span>' +
          '</div>' +
        '</div>';
      });

      container.innerHTML = html;
    }

    function openModal(id) {
      var item = DATA_LIC.find(e => e.id === id);
      if (!item) return;

      var evalHito = evaluarHitoActivo(item);
      document.getElementById('modalHeaderTitle').textContent = (item.cod || 'LIC') + ' - ' + item.mandante;

          '<div class="meta-item"><span class="meta-label">Visita a Terreno</span><span class="meta-val">' + (item.f_visita || 'N/A') + ' (Realizada: ' + item.visita_ok + ')</span></div>' +

          '<span style="font-size:12px; color:var(--text-muted); font-weight:600;">Diagnóstico:</span>' +
          '<span class="alert-tag ' + evalHito.semaforo + '">' + evalHito.texto + '</span>' +
        '</div>' +

        (item.motivo_desistimiento ? 
          '<div style="background:rgba(239, 68, 68, 0.1); border:1px solid rgba(239, 68, 68, 0.3); border-radius:10px; padding:12px;">' +
            '<span class="meta-label" style="color:#fca5a5;">Observaciones / Responsable:</span>' +
            '<p style="font-size:12px; color:#e2e8f0; margin-top:4px;">' + item.motivo_desistimiento + '</p>' +
          '</div>' : '');

      document.getElementById('modalBodyContent').innerHTML = modalHtml;
      document.getElementById('licitacionModal').classList.add('active');
    }

    function closeModal(e) { if (e.target.id === 'licitacionModal') document.getElementById('licitacionModal').classList.remove('active'); }

    window.addEventListener('DOMContentLoaded', () => syncCloudData());
